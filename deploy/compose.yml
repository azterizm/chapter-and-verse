# Chapter & Verse on the Oracle A1 VM (4 OCPU, 24 GB, Ubuntu 24.04 ARM64).
#
#   docker compose -f deploy/compose.yml up -d --build
#
# Secrets are never in this file or the repository. They come from env files outside the repo,
# by default under /etc/chapter-and-verse/ (created by deploy/oracle/setup.sh, mode 0640 root:deploy):
#   engine.env       DATABASE_URL, GROQ_API_KEY, CLOUDFLARE_AI_WORKER_TOKEN, MODAL_API_KEY, ...
#   cloudflared.env  TUNNEL_TOKEN (only for the optional "tunnel" profile below)
#
# The engine listens on 127.0.0.1:8000 only. On Oracle the Cloudflare Tunnel runs as the host
# systemd service "cloudflared-cv" (setup.sh) and forwards to http://127.0.0.1:8000. Hosts without
# that service can run the tunnel here instead: docker compose --profile tunnel up -d
# Run one connector or the other, not both.

name: chapter-and-verse

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  engine:
    image: ${ENGINE_IMAGE:-chapter-and-verse-engine:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ${CV_ENV_DIR:-/etc/chapter-and-verse}/engine.env
        required: true
    environment:
      PORT: "8000"
      DATA_DIR: /data
      LEGAL_DATA_ROOT: /data
      STORE_DIR: /data
      STORE_RESIDENT: "1"
      STORE_RESIDENT_MAX_BYTES: "8589934592"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artefacts:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /ram:size=3g,mode=0700,uid=1000,gid=1000
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # 24 GB host: about 4 GB of indexes and store held resident, plus Python, page cache for the
    # memory-mapped tables and headroom for Slice 3 vectors. 3 GB left for the OS, Docker and the
    # tunnel. memswap_limit equal to mem_limit keeps the engine out of swap.
    mem_limit: 20g
    memswap_limit: 20g
    mem_reservation: 8g
    cpus: 4
    pids_limit: 512
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    stop_grace_period: 30s
    logging: *logging
    # The healthcheck is defined in the image (GET /api/health, 900 s start period).

  cloudflared:
    profiles: ["tunnel"]
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.7}
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    restart: unless-stopped
    env_file:
      - path: ${CV_ENV_DIR:-/etc/chapter-and-verse}/cloudflared.env
        required: true
    # Host networking so the tunnel's ingress target is http://127.0.0.1:8000 in both setups.
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    logging: *logging
    depends_on:
      engine:
        condition: service_started

volumes:
  # Artefacts (about 4 GB) survive container and image replacement; fetch_artefacts.py skips the
  # download when the volume already verifies.
  artefacts:
    name: chapter-and-verse-artefacts
