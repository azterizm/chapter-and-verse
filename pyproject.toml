[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chapterverse"
version = "0.0.1"
description = "Chapter & Verse: UK legislation answers with verified, system-rendered citations"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "legal-rag-router==0.1.1",
    "legal-rag-verifier==0.5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "zstandard>=0.23",
    "orjson>=3.10",
    "psycopg[binary]>=3.2",
    "tokenizers>=0.21",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.8",
    "respx>=0.21",
    "anyio>=4.6",
]

# ---------------------------------------------------------------- build
[tool.hatch.build.targets.wheel]
packages = ["engine/chapterverse"]

[tool.hatch.build.targets.sdist]
include = ["engine/chapterverse", "tests", "docs", "README.md", "LICENSE", "NOTICE"]

# ---------------------------------------------------------------- lint / format
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["engine", "."]
extend-exclude = ["web", "artefacts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "N",
    "S", "BLE", "A", "T20", "ISC", "PIE", "RET", "PTH", "TRY", "PERF", "FBT",
]
ignore = [
    "PLR0913",  # constructors of wire types legitimately take many parameters
    "TRY003",   # contextual messages on raised exceptions are wanted
    "ISC001",   # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "PLR2004", "FBT", "S311"]
"scripts/**" = ["T20"]
"build/**" = ["T20"]
"eval/**" = ["T20"]
"batteries/**" = ["T20", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["chapterverse"]

# ---------------------------------------------------------------- types
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = "engine"
files = ["engine", "tests", "scripts"]
explicit_package_bases = true

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "data: needs the real corpus at LEGAL_DATA_ROOT (skipped when it is unset)",
]
